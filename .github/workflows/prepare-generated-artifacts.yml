name: Prepare generated development artifacts

on:
  push:
    branches: ["phase-b/**"]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Install dependencies and create npm lockfile
        run: npm install --no-audit --no-fund
      - name: Start clean local Supabase
        run: |
          supabase start
          supabase db reset
      - name: Generate schema-derived TypeScript types
        run: npm run db:types
      - name: Format repository in an isolated CI workspace
        run: npx prettier --write .
      - name: Verify formatting
        run: npm run format
      - name: Package changed and generated files
        run: |
          git ls-files -m -o --exclude-standard > /tmp/changed-files.txt
          tar -czf phase-b-generated-files.tar.gz -T /tmp/changed-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase-b-generated-files
          path: phase-b-generated-files.tar.gz
          if-no-files-found: error
          retention-days: 3
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
