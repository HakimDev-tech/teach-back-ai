name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "phase-a/**", "phase-b/**", "phase-c/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Create migration scaffold when requested
        if: contains(github.event.head_commit.message, '[new-migration]')
        run: supabase migration new phase_b_domain_hardening
      - uses: docker/setup-buildx-action@v3
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Start local Supabase
        run: supabase start
      - name: Apply migrations from a clean database
        run: supabase db reset
      - name: Database lint
        run: npm run db:lint
      - name: Run pgTAP security tests
        run: supabase test db
      - name: Generate database types from the local schema
        if: always()
        run: npm run db:types
      - name: Format repository in the CI workspace
        if: always()
        run: npx prettier --write .
      - name: Verify formatting
        if: always()
        run: npm run format
      - name: Lint
        if: always()
        run: npm run lint
      - name: Type check
        if: always()
        run: npm run typecheck
      - name: Unit tests
        if: always()
        run: npm test
      - name: Dependency audit
        if: always()
        run: npm audit --audit-level=high
      - name: Production build
        if: always()
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      - name: Package generated development artifacts
        if: always()
        run: |
          git ls-files -m -o --exclude-standard > /tmp/changed-files.txt
          if [ -s /tmp/changed-files.txt ]; then
            tar -czf phase-b-generated-files.tar.gz -T /tmp/changed-files.txt
          else
            printf "No generated or modified files were produced.\n" > phase-b-generated-files.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-b-generated-files
          path: |
            phase-b-generated-files.tar.gz
            phase-b-generated-files.txt
          if-no-files-found: error
          retention-days: 3
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
